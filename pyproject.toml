[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-design-studio"
version = "1.2.1"
description = "Reusable Design Studio, 16-mood theme engine, 8-state semantic harmony, glass/brutal card surfaces, adaptive SVG backgrounds, and Chart.js harmonizer for Django + Bootstrap 5."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Django>=4.2",
]

[tool.setuptools.packages.find]
include = ["design_studio*"]

[tool.setuptools.package-data]
design_studio = [
    "templates/**/*",
    "static/**/*",
]
