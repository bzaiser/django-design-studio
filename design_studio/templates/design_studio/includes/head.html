{% load static %}
<style>
    :root {
        --bs-primary: {{ theme_palette.primary_color|default:"#0d6efd" }};
        --bs-body-bg: {{ theme_palette.background_color|default:"#ffffff" }};
        --bs-body-color: {{ theme_palette.text_color|default:"#212529" }};
        --app-primary: var(--bs-primary);
        --app-card-bg: var(--bs-body-bg);
        --app-card-color: var(--bs-body-color);
        --app-sidebar-bg: {{ theme_palette.sidebar_bg_color|default:"#f8f9fa" }};
        --app-gradient: linear-gradient(135deg, {{ theme_palette.c1|default:"#6610f2" }} 0%, {{ theme_palette.c2|default:"#0d6efd" }} 100%);
        --app-preview-gradient: var(--app-gradient);
        --app-table-header-bg: {{ theme_palette.table_header_bg_color|default:"#0d6efd" }};
        --app-table-header-text: {{ theme_palette.table_header_text_color|default:"#ffffff" }};
        --app-table-filter-bg: color-mix(in srgb, var(--app-primary, #0d6efd) 6%, transparent);
        --app-table-body-bg: {{ theme_palette.table_body_bg_color|default:"var(--app-card-bg)" }};
        --app-table-body-text: {{ theme_palette.table_body_text_color|default:"var(--app-card-color)" }};
        --app-table-border-color: {{ theme_palette.table_border_color|default:"rgba(0,0,0,0.1)" }};
        --app-table-row-hover-bg: color-mix(in srgb, var(--app-primary, #0d6efd) 8%, transparent);
        --bs-modal-bg: var(--app-card-bg);
        --bs-modal-color: var(--app-card-color);
        --bs-tertiary-bg: var(--app-card-bg);
        --bs-card-bg: var(--app-card-bg);
        --bs-card-color: var(--app-card-color);
        --app-input-bg: {{ theme_palette.table_body_bg_color|default:"var(--app-card-bg)" }};
        --app-input-color: {{ theme_palette.table_body_text_color|default:"var(--app-card-color)" }};
        --app-input-border: {{ theme_palette.table_border_color|default:"rgba(0,0,0,0.1)" }};
        --app-ui-zoom: {{ theme_studio.ui_zoom|default:100 }};
        --glass-alpha: {{ theme_studio.glass_alpha_css|default:"0.32" }};
        --glass-blur: {{ theme_studio.glass_blur|default:14 }}px;
        --bg-strength: {{ theme_studio.bg_strength_css|default:"0.65" }};
        {% if theme_palette and theme_palette.states %}
        {% for st in theme_palette.states %}
        --theme-state-{{ st.index }}: {{ st.hex }};
        --theme-state-{{ st.index }}-bg: {{ st.bg }};
        --theme-state-{{ st.index }}-txt: {{ st.txt }};
        {% endfor %}
        {% endif %}
    }
    {% if active_genre %}
    body[data-genre="{{ active_genre.key }}"] {
        --ds-genre-accent: {{ active_genre.primary }};
        --ds-genre-secondary: {{ active_genre.secondary }};
        {% if not theme_palette.is_dark and active_genre.bg_light %}background-color: {{ active_genre.bg_light }} !important;{% endif %}
    }
    {% if active_genre.font_head %}
    body[data-genre="{{ active_genre.key }}"] main h1,
    body[data-genre="{{ active_genre.key }}"] main h2,
    body[data-genre="{{ active_genre.key }}"] main h3 {
        font-family: {{ active_genre.font_head|safe }};
    }
    {% endif %}
    {% endif %}
    .ds-nav-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 17px;
        height: 17px;
        padding: 0 4px;
        border-radius: 999px;
        font-size: 0.65rem;
        font-weight: 700;
        line-height: 1;
        color: #ffffff;
        background: var(--theme-state-8, #dc3545);
        box-shadow: 0 0 0 2px var(--bs-body-bg, #ffffff);
        pointer-events: none;
        z-index: 2;
    }
    .ds-nav-badge[data-level="warning"] {
        background: var(--theme-state-6, #fd7e14);
    }
    .ds-nav-badge[data-level="primary"],
    .ds-nav-badge[data-level="info"] {
        background: var(--theme-state-5, var(--app-primary, #0d6efd));
    }
    .ds-nav-dot {
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 999px;
        background: var(--theme-state-6, #fd7e14);
        box-shadow: 0 0 0 2px var(--bs-body-bg, #ffffff);
        pointer-events: none;
        z-index: 2;
    }
    .ds-nav-dot[data-level="danger"] {
        background: var(--theme-state-8, #dc3545);
    }
    .app-nav-icon-only .ds-nav-badge,
    body.sidebar-collapsed[data-menu-layout="sidebar"] .app-navbar .nav-link .ds-nav-badge {
        position: absolute;
        top: 2px;
        right: 2px;
    }
    .app-nav-icon-only .ds-nav-dot,
    body.sidebar-collapsed[data-menu-layout="sidebar"] .app-navbar .nav-link .ds-nav-dot {
        position: absolute;
        top: 5px;
        right: 5px;
    }
    .app-navbar .nav-link:not(.app-nav-icon-only) .ds-nav-badge,
    .app-navbar .nav-link:not(.app-nav-icon-only) .ds-nav-dot {
        margin-left: 0.35rem;
    }
    @media (min-width: 992px) {
        body:not([data-menu-layout="sidebar"]) .app-navbar-header,
        body:not([data-menu-layout="sidebar"]) .app-navbar .w-lg-auto {
            width: auto !important;
            margin-right: 0.75rem;
        }
        .menu-layout-toggle-btn {
            display: inline-flex !important;
            align-items: center;
            justify-content: center;
            border: none;
            background: transparent;
            padding: 0.25rem 0.4rem;
            border-radius: 8px;
            opacity: 0.85;
            cursor: pointer;
            text-decoration: none;
        }
        body[data-menu-layout="sidebar"] .app-navbar-header {
            width: 100% !important;
            gap: 0.25rem;
        }
        body[data-menu-layout="sidebar"] .app-navbar .navbar-brand {
            min-width: 0;
            flex: 1 1 auto;
            overflow: hidden;
            margin-right: 0;
        }
        body[data-menu-layout="sidebar"] .app-navbar .brand-text {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        body[data-menu-layout="sidebar"] .app-navbar-toggles {
            flex-shrink: 0;
        }
        body[data-menu-layout="sidebar"] .sidebar-toggle-btn {
            display: inline-flex !important;
            align-items: center;
            justify-content: center;
            border: none;
            background: transparent;
            padding: 0.25rem 0.4rem;
            border-radius: 8px;
            opacity: 0.85;
            cursor: pointer;
        }
        body[data-menu-layout="sidebar"].sidebar-collapsed .app-navbar-header {
            flex-direction: column !important;
            align-items: center !important;
            gap: 0.25rem;
        }
        body[data-menu-layout="sidebar"].sidebar-collapsed .app-navbar-toggles {
            flex-direction: column !important;
            align-items: center !important;
            gap: 0.2rem !important;
        }
    }
</style>
<link rel="stylesheet" href="{% static 'design_studio/css/design-studio.css' %}?v=1.6.14">
{% if design_studio_pwa_enabled %}
<meta name="theme-color" content="{{ theme_palette.primary_color|default:'#0d6efd' }}">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="{% url 'design_studio:pwa_manifest' %}">
<link rel="icon" type="image/svg+xml" href="{% url 'design_studio:pwa_icon_svg' %}">
{% endif %}
{% if theme_palette_json %}
<script>window.APP_THEME_PALETTE = {{ theme_palette_json|safe }};</script>
{% endif %}
